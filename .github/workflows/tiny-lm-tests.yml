name: tiny LM model tests

on:
  push:
    branches: ["research/long-term-memory-starter"]
    paths:
      - "src/ltm/tiny_lm.py"
      - "src/ltm/bpe_tokenizer.py"
      - "scripts/train_tiny_lm.py"
      - "scripts/train_tiny_lm_sft.py"
      - "scripts/generate_memory_sft.py"
      - "examples/tiny_lm_sft_demo.jsonl"
      - "scripts/prepare_wikitext.py"
      - "requirements-tiny-lm-data.txt"
  pull_request:
    paths:
      - "src/ltm/tiny_lm.py"
      - "src/ltm/bpe_tokenizer.py"
      - "scripts/train_tiny_lm.py"
      - "scripts/train_tiny_lm_sft.py"
      - "scripts/generate_memory_sft.py"
      - "examples/tiny_lm_sft_demo.jsonl"
      - "scripts/prepare_wikitext.py"
      - "requirements-tiny-lm-data.txt"

jobs:
  tiny-lm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and dataset loader
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-tiny-lm-data.txt
      - name: Run full test suite including tiny model
        run: python -m unittest discover -s tests -v
      - name: Smoke-test training and memory-backed inference
        run: |
          cat README.md docs/from-scratch-memory-lm.md > /tmp/tiny-lm-smoke.txt
          python scripts/train_tiny_lm.py --input /tmp/tiny-lm-smoke.txt --output-dir /tmp/tiny-lm-checkpoint --steps 10 --batch-size 2 --block-size 32 --d-model 32 --layers 1 --heads 4 --eval-interval 5 --device cpu
          python -c "from src.ltm.store import MemoryStore; s=MemoryStore('/tmp/tiny-lm-memory.sqlite3'); t=s.add_turn('ci-smoke','The project is a from-scratch memory language model.'); s.add_memory('ci-smoke','The project is a from-scratch memory language model.', category='project', source_turn_id=t)"
          python scripts/chat_tiny_lm.py --checkpoint /tmp/tiny-lm-checkpoint/best.pt --database /tmp/tiny-lm-memory.sqlite3 --user ci-smoke --question "What is the project?" --max-new-tokens 4 --temperature 1.0
          python scripts/train_tiny_lm_sft.py --input examples/tiny_lm_sft_demo.jsonl --checkpoint /tmp/tiny-lm-checkpoint/best.pt --output /tmp/tiny-lm-instruct.pt --steps 5 --batch-size 2 --device cpu
          python scripts/chat_tiny_lm.py --checkpoint /tmp/tiny-lm-instruct.pt --database /tmp/tiny-lm-memory.sqlite3 --user ci-smoke --question "What is the project?" --max-new-tokens 4 --temperature 1.0
      - name: Prepare WikiText-2 corpus
        run: python scripts/prepare_wikitext.py --output-dir data/wikitext-2
      - name: Train model from random initialization on WikiText-2
        run: |
          python scripts/train_tiny_lm.py --input data/wikitext-2/train.txt --validation-input data/wikitext-2/validation.txt --output-dir models/tiny-memory-lm --steps 1000 --batch-size 8 --block-size 128 --d-model 128 --layers 2 --heads 4 --eval-interval 100 --device cpu | tee training.log
      - name: Evaluate held-out WikiText-2 test split
        run: python scripts/evaluate_tiny_lm.py --checkpoint models/tiny-memory-lm/best.pt --input data/wikitext-2/test.txt --device cpu > test-metrics.json
      - name: Build memory-grounding instruction data
        run: python scripts/generate_memory_sft.py --output /tmp/tiny-lm-memory-grounding-sft.jsonl
      - name: Supervised instruction-tune the WikiText checkpoint
        run: python scripts/train_tiny_lm_sft.py --input /tmp/tiny-lm-memory-grounding-sft.jsonl --checkpoint models/tiny-memory-lm/best.pt --output models/tiny-memory-lm/instruct.pt --steps 2000 --batch-size 4 --device cpu | tee instruction-tuning.log
      - name: Test memory retrieval with instruction-tuned checkpoint
        run: python scripts/chat_tiny_lm.py --checkpoint models/tiny-memory-lm/instruct.pt --database /tmp/tiny-lm-memory.sqlite3 --user ci-smoke --question "What is the project?" --max-new-tokens 64 --temperature 0.8 | tee memory-chat-smoke.txt
      - name: Compare memory and no-memory QA
        run: python scripts/evaluate_tiny_lm_memory_qa.py --checkpoint models/tiny-memory-lm/instruct.pt --cases examples/tiny_lm_memory_qa_eval.jsonl --database /tmp/tiny-lm-qa-eval.sqlite3 --output memory-qa-evaluation.json --max-new-tokens 32
      - name: Evaluate byte model on unseen memory facts
        run: python scripts/evaluate_tiny_lm_memory_qa.py --checkpoint models/tiny-memory-lm/instruct.pt --cases examples/tiny_lm_memory_qa_unseen_facts.jsonl --database /tmp/tiny-lm-unseen-qa-eval.sqlite3 --output unseen-memory-qa-evaluation.json --max-new-tokens 32
      - name: Train from-scratch BPE model on WikiText-2 training split
        run: |
          python scripts/train_tiny_lm.py --input data/wikitext-2/train.txt --validation-input data/wikitext-2/validation.txt --output-dir models/tiny-memory-lm-bpe --tokenizer bpe --vocab-size 512 --steps 1000 --batch-size 8 --block-size 128 --d-model 128 --layers 2 --heads 4 --eval-interval 100 --device cpu | tee bpe-training.log
      - name: Evaluate BPE model on untouched WikiText-2 test split
        run: python scripts/evaluate_tiny_lm.py --checkpoint models/tiny-memory-lm-bpe/best.pt --input data/wikitext-2/test.txt --device cpu > bpe-test-metrics.json
      - name: Supervised instruction-tune BPE model
        run: python scripts/train_tiny_lm_sft.py --input /tmp/tiny-lm-memory-grounding-sft.jsonl --checkpoint models/tiny-memory-lm-bpe/best.pt --output models/tiny-memory-lm-bpe/instruct.pt --steps 2000 --batch-size 4 --device cpu | tee bpe-instruction-tuning.log
      - name: Compare BPE memory and no-memory QA
        run: python scripts/evaluate_tiny_lm_memory_qa.py --checkpoint models/tiny-memory-lm-bpe/instruct.pt --cases examples/tiny_lm_memory_qa_eval.jsonl --database /tmp/tiny-lm-bpe-qa-eval.sqlite3 --output bpe-memory-qa-evaluation.json --max-new-tokens 32
      - name: Evaluate BPE model on unseen memory facts
        run: python scripts/evaluate_tiny_lm_memory_qa.py --checkpoint models/tiny-memory-lm-bpe/instruct.pt --cases examples/tiny_lm_memory_qa_unseen_facts.jsonl --database /tmp/tiny-lm-bpe-unseen-qa-eval.sqlite3 --output bpe-unseen-memory-qa-evaluation.json --max-new-tokens 32
      - name: Upload pilot checkpoint and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: tiny-memory-lm-wikitext2-pilot-${{ github.run_id }}
          path: |
            models/tiny-memory-lm/*.pt
            training.log
            instruction-tuning.log
            test-metrics.json
            memory-chat-smoke.txt
            memory-qa-evaluation.json
            data/wikitext-2/PROVENANCE.txt
            models/tiny-memory-lm-bpe/*.pt
            bpe-training.log
            bpe-test-metrics.json
            bpe-instruction-tuning.log
            bpe-memory-qa-evaluation.json
            unseen-memory-qa-evaluation.json
            bpe-unseen-memory-qa-evaluation.json
          retention-days: 30
