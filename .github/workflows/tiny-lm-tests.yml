name: tiny LM model tests

on:
  push:
    branches: ["research/long-term-memory-starter"]
    paths:
      - "src/ltm/tiny_lm.py"
      - "scripts/train_tiny_lm.py"
      - "scripts/train_tiny_lm_sft.py"
      - "scripts/evaluate_tiny_lm_memory_qa.py"
      - "examples/tiny_lm_memory_qa_eval.jsonl"
      - "examples/tiny_lm_sft_demo.jsonl"
      - "scripts/chat_tiny_lm.py"
      - "scripts/evaluate_tiny_lm.py"
      - "scripts/prepare_wikitext.py"
      - "requirements-tiny-lm-data.txt"
      - "tests/test_tiny_lm.py"
      - ".github/workflows/tiny-lm-tests.yml"
  pull_request:
    paths:
      - "src/ltm/tiny_lm.py"
      - "scripts/train_tiny_lm.py"
      - "scripts/train_tiny_lm_sft.py"
      - "scripts/evaluate_tiny_lm_memory_qa.py"
      - "examples/tiny_lm_sft_demo.jsonl"
      - "examples/tiny_lm_memory_qa_eval.jsonl"
      - "scripts/chat_tiny_lm.py"
      - "scripts/evaluate_tiny_lm.py"
      - "scripts/prepare_wikitext.py"
      - "requirements-tiny-lm-data.txt"
      - "tests/test_tiny_lm.py"
      - ".github/workflows/tiny-lm-tests.yml"

jobs:
  tiny-lm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and dataset loader
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-tiny-lm-data.txt
      - name: Run full test suite including tiny model
        run: python -m unittest discover -s tests -v
      - name: Smoke-test training and memory-backed inference
        run: |
          cat README.md docs/from-scratch-memory-lm.md > /tmp/tiny-lm-smoke.txt
          python scripts/train_tiny_lm.py --input /tmp/tiny-lm-smoke.txt --output-dir /tmp/tiny-lm-checkpoint --steps 10 --batch-size 2 --block-size 32 --d-model 32 --layers 1 --heads 4 --eval-interval 5 --device cpu
          python -c "from src.ltm.store import MemoryStore; s=MemoryStore('/tmp/tiny-lm-memory.sqlite3'); t=s.add_turn('ci-smoke','The project is a from-scratch memory language model.'); s.add_memory('ci-smoke','The project is a from-scratch memory language model.', category='project', source_turn_id=t)"
          python scripts/chat_tiny_lm.py --checkpoint /tmp/tiny-lm-checkpoint/best.pt --database /tmp/tiny-lm-memory.sqlite3 --user ci-smoke --question "What is the project?" --max-new-tokens 4 --temperature 1.0
          python scripts/train_tiny_lm_sft.py --input examples/tiny_lm_sft_demo.jsonl --checkpoint /tmp/tiny-lm-checkpoint/best.pt --output /tmp/tiny-lm-instruct.pt --steps 5 --batch-size 2 --device cpu
          python scripts/chat_tiny_lm.py --checkpoint /tmp/tiny-lm-instruct.pt --database /tmp/tiny-lm-memory.sqlite3 --user ci-smoke --question "What is the project?" --max-new-tokens 4 --temperature 1.0
      - name: Prepare WikiText-2 corpus
        run: python scripts/prepare_wikitext.py --output-dir data/wikitext-2
      - name: Train model from random initialization on WikiText-2
        run: |
          python scripts/train_tiny_lm.py --input data/wikitext-2/train.txt --validation-input data/wikitext-2/validation.txt --output-dir models/tiny-memory-lm --steps 100 --batch-size 8 --block-size 128 --d-model 128 --layers 2 --heads 4 --eval-interval 25 --device cpu | tee training.log
      - name: Evaluate held-out WikiText-2 test split
        run: python scripts/evaluate_tiny_lm.py --checkpoint models/tiny-memory-lm/best.pt --input data/wikitext-2/test.txt --device cpu > test-metrics.json
      - name: Test memory retrieval with trained checkpoint
        run: python scripts/chat_tiny_lm.py --checkpoint models/tiny-memory-lm/best.pt --database /tmp/tiny-lm-memory.sqlite3 --user ci-smoke --question "What is the project?" --max-new-tokens 32 --temperature 0.8 | tee memory-chat-smoke.txt
      - name: Compare memory and no-memory QA
        run: python scripts/evaluate_tiny_lm_memory_qa.py --checkpoint models/tiny-memory-lm/best.pt --cases examples/tiny_lm_memory_qa_eval.jsonl --database /tmp/tiny-lm-qa-eval.sqlite3 --output memory-qa-evaluation.json --max-new-tokens 32
      - name: Upload pilot checkpoint and evaluation
        uses: actions/upload-artifact@v4
        with:
          name: tiny-memory-lm-wikitext2-pilot-${{ github.run_id }}
          path: |
            models/tiny-memory-lm/*.pt
            training.log
            test-metrics.json
            memory-chat-smoke.txt
            memory-qa-evaluation.json
            data/wikitext-2/PROVENANCE.txt
          retention-days: 30
