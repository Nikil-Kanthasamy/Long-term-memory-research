name: joint-span analysis tests

on:
  workflow_dispatch:
  push:
    branches: ["research/long-term-memory-starter"]
    paths:
      - "scripts/analyze_tiny_lm_joint_span_errors.py"
      - "tests/test_tiny_lm_joint_span_error_analysis.py"
      - "scripts/train_tiny_lm_joint_span.py"
      - "scripts/evaluate_tiny_lm_joint_span_penalties.py"
      - "tests/test_tiny_lm_joint_span.py"
      - ".github/workflows/joint-span-analysis-tests.yml"

jobs:
  analysis-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile analyzer and tests
        run: python -m compileall -q scripts/analyze_tiny_lm_joint_span_errors.py tests/test_tiny_lm_joint_span_error_analysis.py
      - name: Run offline analysis utility tests
        run: python -m unittest discover -s tests -p 'test_tiny_lm_joint_span_error_analysis.py' -v
      - name: Check analyzer CLI
        run: python scripts/analyze_tiny_lm_joint_span_errors.py --help
      - name: Run joint-span decoder tests
        run: python -m unittest discover -s tests -p 'test_tiny_lm_joint_span.py' -v
      - name: Check penalty sweep CLI
        run: python scripts/evaluate_tiny_lm_joint_span_penalties.py --help
