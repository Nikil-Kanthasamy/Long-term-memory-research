name: PRAGMA independent session retrieval benchmark

on:
  push:
    branches:
      - research/long-term-memory-starter
    paths:
      - .github/workflows/pragma-retrieval.yml
      - scripts/build_pragma_session_retrieval_eval.py
      - scripts/build_longmemeval_turn_retrieval_eval.py
      - tests/test_pragma_session_retrieval_eval.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pragma-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/long-term-memory-starter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dataset downloader
        run: python -m pip install huggingface_hub

      - name: Resolve and download licensed PRAGMA files
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p data results
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download

          repo_id = "stellahj/PRAGMA"
          revision = HfApi().dataset_info(repo_id).sha
          if not revision or len(revision) != 40:
              raise SystemExit(f"Could not resolve immutable dataset revision: {revision!r}")
          Path("data/PRAGMA_REVISION.txt").write_text(revision + "\\n", encoding="utf-8")
          for filename in ("LICENSE", "data/full_sessions.json", "data/metadata.json"):
              downloaded = hf_hub_download(
                  repo_id=repo_id, filename=filename, repo_type="dataset",
                  revision=revision,
              )
              target = Path(filename)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(Path(downloaded).read_bytes())
              print(f"Downloaded {filename} from {revision}")
          license_sha = hashlib.sha256(Path("LICENSE").read_bytes()).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PRAGMA_REVISION={revision}\\n")
              env.write(f"PRAGMA_LICENSE_SHA256={license_sha}\\n")
          PY

      - name: Run session-level retrieval benchmark
        run: |
          python scripts/build_pragma_session_retrieval_eval.py \\
            --histories data/full_sessions.json \\
            --metadata data/metadata.json \\
            --output results/pragma_session_retrieval.json \\
            --bootstrap-resamples 20000 \\
            --dataset-revision "$PRAGMA_REVISION" \\
            --license-sha256 "$PRAGMA_LICENSE_SHA256"

      - name: Upload metrics only (no histories or user profiles)
        uses: actions/upload-artifact@v4
        with:
          name: pragma-session-retrieval-${{ github.run_id }}
          path: results/pragma_session_retrieval.json
          if-no-files-found: error
          retention-days: 30
